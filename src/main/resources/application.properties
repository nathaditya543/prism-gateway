spring.application.name=prism-gateway
server.port=${PORT:8080}

# Embedded H2 in file mode: keys, usage, request logs and cache entries survive restarts.
spring.datasource.url=jdbc:h2:file:./var/prismdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=20
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Streams can legitimately run long; upstream idle timeouts are enforced separately.
spring.mvc.async.request-timeout=300000

prism.admin-token=${PRISM_ADMIN_TOKEN:prism-admin-dev}
prism.gateway-config=data/gateway_config.sample.json
prism.pricing-file=data/model_pricing.json
prism.seed-keys-file=data/seed_keys.json
prism.routing-eval-file=data/routing_eval.jsonl
prism.upstream.connect-timeout-ms=1000
prism.upstream.request-timeout-ms=2500
prism.upstream.stream-idle-timeout-ms=5000
prism.cache.ttl-minutes=1440
prism.cache.max-entries-per-scope=500
